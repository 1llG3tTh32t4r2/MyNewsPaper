<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Newspaper Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #000;
            border-bottom: 3px solid #d97706;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-family: Georgia, serif;
        }

        header p {
            color: #aaa;
            margin-bottom: 0;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .panel {
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 25px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: #0d0d0d;
            color: white;
            border: 1px solid #444;
            font-size: 16px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #d97706;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #f59e0b;
        }

        .article {
            border-top: 1px solid #444;
            padding: 20px 0;
        }

        .article:first-child {
            border-top: none;
        }

        .article h3 {
            margin-bottom: 5px;
        }

        .article small {
            color: #999;
        }

        .delete {
            background: #8b0000;
        }

        .delete:hover {
            background: #b00000;
        }

        a {
            color: #f59e0b;
        }
    </style>
</head>

<body>

<header>
    <h1>Newspaper Admin</h1>
    <p>Write and publish your articles.</p>
</header>

<main>

    <div class="panel">

        <h2>Publish New Article</h2>

        <label for="title">Title</label>
        <input id="title" type="text" placeholder="Article title">

        <label for="category">Category</label>
        <select id="category">
            <option>News</option>
            <option>Technology</option>
            <option>Science</option>
            <option>Sports</option>
            <option>Culture</option>
            <option>Opinion</option>
        </select>

        <label for="author">Author</label>
        <input id="author" type="text" placeholder="Author name">

        <label for="description">Short Description</label>
        <textarea id="description"
            placeholder="A short summary of the article..."></textarea>

        <label for="content">Article Content</label>
        <textarea id="content"
            placeholder="Write your complete article here..."></textarea>

        <label for="image">Image URL</label>
        <input id="image"
            type="text"
            placeholder="https://example.com/image.jpg">

        <button onclick="publishArticle()">
            PUBLISH ARTICLE
        </button>

        <p id="message"></p>

    </div>


    <div class="panel">

        <h2>Published Articles</h2>

        <div id="articles">
            Loading articles...
        </div>

    </div>

    <p>
        <a href="/" target="_blank">
            Open Public Newspaper
        </a>
    </p>

</main>


<script>

async function publishArticle() {

    const title = document.getElementById("title").value;
    const category = document.getElementById("category").value;
    const author = document.getElementById("author").value;
    const description = document.getElementById("description").value;
    const content = document.getElementById("content").value;
    const image = document.getElementById("image").value;

    const message = document.getElementById("message");

    if (!title || !content) {
        message.textContent =
            "Please enter a title and article content.";

        return;
    }

    const response = await fetch("/api/publish", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            title,
            category,
            author,
            description,
            content,
            image
        })
    });

    const data = await response.json();

    if (response.ok) {

        message.textContent = "Article published successfully.";

        document.getElementById("title").value = "";
        document.getElementById("author").value = "";
        document.getElementById("description").value = "";
        document.getElementById("content").value = "";
        document.getElementById("image").value = "";

        loadArticles();

    } else {

        message.textContent =
            data.error || "Something went wrong.";

    }
}


async function loadArticles() {

    const response = await fetch("/api/newspaper");

    const newspaper = await response.json();

    const container = document.getElementById("articles");

    if (newspaper.articles.length === 0) {

        container.innerHTML =
            "<p>No articles published yet.</p>";

        return;
    }

    container.innerHTML = "";

    newspaper.articles.forEach(article => {

        const div = document.createElement("div");

        div.className = "article";

        div.innerHTML = `
            <h3>${article.title}</h3>

            <small>
                ${article.category} |
                ${article.author} |
                ${article.date}
            </small>

            <p>${article.description}</p>

            <button
                class="delete"
                onclick="deleteArticle(${article.id})">
                DELETE
            </button>
        `;

        container.appendChild(div);

    });
}


async function deleteArticle(id) {

    if (!confirm("Delete this article?")) {
        return;
    }

    await fetch(`/api/delete/${id}`, {
        method: "DELETE"
    });

    loadArticles();
}


loadArticles();

</script>

</body>
</html>
