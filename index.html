<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Robotics Times</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f1e8;
            color: #111;
            font-family: Georgia, "Times New Roman", serif;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #111;
            padding: 25px 15px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 52px;
            letter-spacing: -2px;
        }

        header p {
            margin: 8px 0 0;
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 12px;
            border-bottom: 1px solid #999;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        nav a {
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .breaking {
            max-width: 1200px;
            margin: 20px auto 0;
            padding: 10px;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 25px;
        }

        .newspaper-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .main-article {
            border-right: 1px solid #999;
            padding-right: 30px;
        }

        .main-article h2 {
            font-size: 42px;
            line-height: 1.05;
            margin: 10px 0;
        }

        .side-article {
            border-bottom: 1px solid #999;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .side-article h3 {
            font-size: 25px;
            margin: 5px 0;
        }

        .category {
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date {
            color: #666;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .description {
            font-size: 18px;
            line-height: 1.5;
        }

        .article-content {
            font-size: 17px;
            line-height: 1.7;
            white-space: pre-line;
        }

        .article-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            margin: 15px 0;
        }

        .no-articles {
            text-align: center;
            padding: 80px 20px;
            font-size: 24px;
        }

        footer {
            margin-top: 40px;
            padding: 25px;
            border-top: 3px solid #111;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        @media (max-width: 800px) {

            header h1 {
                font-size: 38px;
            }

            .newspaper-grid {
                grid-template-columns: 1fr;
            }

            .main-article {
                border-right: none;
                border-bottom: 1px solid #999;
                padding-right: 0;
                padding-bottom: 25px;
            }

            nav {
                flex-wrap: wrap;
            }

        }
    </style>
</head>

<body>

<header>

    <h1 id="newspaperName">
        THE ROBOTICS TIMES
    </h1>

    <p>
        TECHNOLOGY • SCIENCE • NEWS • CULTURE
    </p>

</header>


<nav>
    <a href="#">HOME</a>
    <a href="#">NEWS</a>
    <a href="#">TECHNOLOGY</a>
    <a href="#">SCIENCE</a>
    <a href="#">SPORTS</a>
    <a href="#">CULTURE</a>
</nav>


<div class="breaking">
    BREAKING NEWS
</div>


<main>

    <div id="news">

        <div class="no-articles">
            Loading newspaper...
        </div>

    </div>

</main>


<footer>

    THE ROBOTICS TIMES<br>
    Independent Digital Newspaper

</footer>


<script>

async function loadNewspaper() {

    try {

        const response =
            await fetch("/api/newspaper");

        const newspaper =
            await response.json();

        document.getElementById("newspaperName")
            .textContent = newspaper.newspaperName;

        const newsContainer =
            document.getElementById("news");

        if (newspaper.articles.length === 0) {

            newsContainer.innerHTML = `
                <div class="no-articles">
                    <p>No articles have been published yet.</p>
                    <p>Check back soon.</p>
                </div>
            `;

            return;
        }

        const articles = newspaper.articles;

        let html = `
            <div class="newspaper-grid">

                <article class="main-article">

                    <div class="category">
                        ${articles[0].category}
                    </div>

                    <h2>
                        ${articles[0].title}
                    </h2>

                    <div class="date">
                        ${articles[0].date} —
                        ${articles[0].author}
                    </div>
        `;

        if (articles[0].image) {

            html += `
                <img
                    class="article-image"
                    src="${articles[0].image}"
                    alt="${articles[0].title}">
            `;

        }

        html += `
                    <p class="description">
                        ${articles[0].description}
                    </p>

                    <p class="article-content">
                        ${articles[0].content}
                    </p>

                </article>

                <aside>
        `;


        for (let i = 1; i < articles.length; i++) {

            const article = articles[i];

            html += `

                <article class="side-article">

                    <div class="category">
                        ${article.category}
                    </div>

                    <h3>
                        ${article.title}
                    </h3>

                    <div class="date">
                        ${article.date} —
                        ${article.author}
                    </div>

                    <p>
                        ${article.description}
                    </p>

                </article>

            `;

        }


        html += `
                </aside>

            </div>
        `;

        newsContainer.innerHTML = html;

    }

    catch (error) {

        document.getElementById("news")
            .innerHTML = `
                <div class="no-articles">
                    Could not load newspaper.
                </div>
            `;

        console.error(error);

    }

}


loadNewspaper();

</script>

</body>
</html>
